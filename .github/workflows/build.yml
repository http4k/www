name: Build and Deploy
on:
  push:
    branches:
    - master
  repository_dispatch:
    types:
    - release
  workflow_dispatch:
  schedule:
  - cron: 0 0,6,12,18 * * *
jobs:
  release-site:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Setup Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        java-version: '21'
        distribution: temurin
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      with:
        gradle-version: 9.0.0
    - name: Build
      timeout-minutes: 25
      run: ./gradlew check
      shell: bash
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
      with:
        hugo-version: 0.163.0
        extended: 'true'
    - name: Build Site
      run: hugo --minify -s src/website
      shell: bash
    - name: Deploy
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
      with:
        personal_token: ${{ secrets.TOOLBOX_REPO_TOKEN }}
        external_repository: http4k/http4k.github.io
        publish_branch: master
        publish_dir: build/www
        cname: www.http4k.org
        force_orphan: 'true'