<head>
  <!-- Title -->
  <title>{{ with .Title }} {{ . }} | {{ end }} {{ .Site.Title }}</title>

  <!-- Meta -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
  <meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{end}}" />
  <!-- Fonts are self-hosted (see scss/shared/_fonts.scss). Preloaded so they are in flight
       alongside the stylesheet rather than discovered only once the CSS has parsed - late
       font arrival was the entire cause of the hero's layout shift. latin only; latin-ext
       is gated by unicode-range and loads on demand. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-latin.woff2" crossorigin>

  {{ partial "head/_resources.html" . }}
  <!-- Favicons and Manifest -->
  {{ partial "head/_favicons.html" . }}

  <!-- SEO: Analytics -->
  {{ partial "head/_seo.html" . }}

  <!-- RSS -->
  {{ range .AlternativeOutputFormats -}}
    {{ printf `<link rel="%s" type="%s" href="%s" title="%s" />` .Rel .MediaType.Type .Permalink $.Site.Title | safeHTML }}
  {{ end -}}
</head>
